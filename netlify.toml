[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Header rules deliberately live in dist/_headers, not here.
#
# netlify.toml is only read from the repo root, so a manual drag-and-drop deploy of
# the dist/ folder would ship without any of them. The `_headers` file is generated
# into dist/ by the portfolio-seo plugin in vite.config.ts (source: src/seo.ts), so
# the same rules apply whether the site is uploaded by hand or built from git.
